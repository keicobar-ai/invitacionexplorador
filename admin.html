<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel Administrativo — Expedición Jurásica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#121611;--panel:#1b2419;--panel2:#243020;--line:#41513a;--cream:#fff8e8;--sand:#e9d6ad;--muted:#c9c2b4;--green:#385b2d;--brown:#65452d;--red:#7f3b31;--shadow:0 16px 34px rgba(0,0,0,.28)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at top,rgba(79,105,61,.15),transparent 38%),var(--bg);color:var(--cream);font-family:"Nunito",system-ui,sans-serif;font-weight:700} button,input{font:inherit} button{cursor:pointer}.hidden{display:none!important}.shell{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:26px 0 46px}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(100%,430px);padding:30px 24px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,var(--panel2),var(--panel));box-shadow:var(--shadow)}
    .brand{margin:0 0 5px;text-align:center;font-family:"Lilita One",cursive;font-size:38px;color:var(--sand)}.subtitle{margin:0 0 25px;text-align:center;color:var(--muted);font-size:14px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:14px;color:#e8dec9}.field input{width:100%;min-height:50px;padding:11px 13px;border:1px solid var(--line);border-radius:13px;outline:none;background:#111710;color:var(--cream)}.field input:focus{border-color:#7d956c}
    .btn{border:0;border-radius:13px;min-height:46px;padding:11px 15px;color:#fff8e8;font-weight:900;background:var(--green);box-shadow:inset 0 -2px rgba(0,0,0,.2)}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:var(--brown)}.btn.danger{background:var(--red)}.btn.small{min-height:38px;padding:8px 11px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}.login-btn{width:100%;margin-top:9px}.message{min-height:20px;margin-top:13px;text-align:center;font-size:14px;color:#f1d7bd}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;padding:18px 20px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}.topbar h1{margin:0;font-family:"Lilita One",cursive;font-size:30px;color:var(--sand)}.topbar p{margin:3px 0 0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:9px;flex-wrap:wrap}
    .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}.stat{padding:17px 14px;border:1px solid var(--line);border-radius:17px;background:var(--panel)}.stat span{display:block;color:var(--muted);font-size:12px;line-height:1.25}.stat strong{display:block;margin-top:6px;font-family:"Lilita One",cursive;font-size:30px;color:var(--sand)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.toolbar h2{margin:0;font-family:"Lilita One",cursive;color:var(--sand);font-size:27px}.toolbar-right{display:flex;gap:10px;flex-wrap:wrap}.search{width:min(360px,100%);min-height:44px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:#111710;color:var(--cream);outline:none}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:960px}th,td{padding:13px 12px;border-bottom:1px solid #33402f;text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#253020;color:#e8dec9;font-size:12px;text-transform:uppercase;letter-spacing:.7px}td{font-size:14px}tbody tr:hover{background:rgba(255,255,255,.025)}.family{font-weight:900;color:#fff4d8}.badge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-size:12px;white-space:nowrap}.badge.confirmed{background:#284c2a;color:#e9ffe8}.badge.declined{background:#5c3028;color:#ffe8e3}.badge.pending{background:#544b27;color:#fff8d6}.badge.inactive{background:#333;color:#ddd}.actions{display:flex;gap:7px;flex-wrap:wrap}.icon-btn{border:1px solid var(--line);background:#192118;color:var(--cream);min-height:36px;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:900}.icon-btn:hover{background:#263323}.empty{padding:34px;text-align:center;color:var(--muted)}
    .modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72)}.modal.open{display:flex}.modal-card{width:min(100%,480px);padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:var(--shadow)}.modal-card h2{margin:0 0 16px;font-family:"Lilita One",cursive;font-size:29px;color:var(--sand)}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.check-row{display:flex;align-items:center;gap:9px;margin-top:14px}.check-row input{width:18px;height:18px}
    @media(max-width:980px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.shell{width:min(100% - 18px,1180px);padding-top:12px}.topbar{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:stretch;flex-direction:column}.toolbar-right{display:grid}.search{width:100%}.modal-actions{display:grid;grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<section id="loginView" class="login-wrap"><div class="login-card"><h1 class="brand">EXPEDICIÓN JURÁSICA</h1><p class="subtitle">Panel de administración</p><form id="loginForm"><div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginButton" class="btn login-btn" type="submit">INICIAR SESIÓN</button><div id="loginMessage" class="message" role="status" aria-live="polite"></div></form></div></section>
<main id="adminView" class="shell hidden"><header class="topbar"><div><h1>Panel Administrativo</h1><p id="sessionEmail">Expedición Jurásica</p></div><div class="top-actions"><button id="refreshButton" class="btn small secondary" type="button">ACTUALIZAR</button><button id="logoutButton" class="btn small danger" type="button">CERRAR SESIÓN</button></div></header>
<section class="stats" aria-label="Resumen"><article class="stat"><span>Familias</span><strong id="statFamilies">0</strong></article><article class="stat"><span>Pases asignados</span><strong id="statAssigned">0</strong></article><article class="stat"><span>Pases confirmados</span><strong id="statConfirmedPasses">0</strong></article><article class="stat"><span>Confirmados</span><strong id="statConfirmed">0</strong></article><article class="stat"><span>No asistirán</span><strong id="statDeclined">0</strong></article><article class="stat"><span>Pendientes</span><strong id="statPending">0</strong></article></section>
<section><div class="toolbar"><h2>Familias invitadas</h2><div class="toolbar-right"><input id="searchInput" class="search" type="search" placeholder="Buscar familia..."><button id="newFamilyButton" class="btn" type="button">+ AGREGAR FAMILIA</button></div></div><div class="table-wrap"><table><thead><tr><th>Familia</th><th>Pases</th><th>Confirmados</th><th>Estado</th><th>Invitación</th><th>Acciones</th></tr></thead><tbody id="familiesBody"></tbody></table><div id="emptyState" class="empty hidden">No hay familias para mostrar.</div></div></section></main>
<div id="familyModal" class="modal" aria-hidden="true"><div class="modal-card"><h2 id="modalTitle">Agregar familia</h2><form id="familyForm"><input id="editId" type="hidden"><div class="field"><label for="familyInput">Nombre de la familia</label><input id="familyInput" type="text" maxlength="120" required placeholder="Ej. Familia Hernández"></div><div class="field"><label for="passesInput">Pases asignados</label><input id="passesInput" type="number" min="1" max="50" inputmode="numeric" required value="2"></div><label class="check-row"><input id="activeInput" type="checkbox" checked><span>Invitación activa</span></label><p id="familyMessage" class="message"></p><div class="modal-actions"><button id="cancelModalButton" class="btn secondary" type="button">CANCELAR</button><button id="saveFamilyButton" class="btn" type="submit">GUARDAR</button></div></form></div></div>
<script>
const SUPABASE_URL="https://jygvmmaqbgrinbvbbesz.supabase.co";
const SUPABASE_PUBLIC_KEY="sb_publishable_LMEt8-OrFRRMZz_6CtdQSw_27S2vcQO";
const PUBLIC_INVITE_URL="https://aventurajurasica.netlify.app/";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY);
const $=id=>document.getElementById(id);let invitaciones=[],confirmaciones=[];
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function inviteUrl(token){return `${PUBLIC_INVITE_URL}?i=${encodeURIComponent(token)}`}
function latestMap(){const m=new Map();[...confirmaciones].sort((a,b)=>new Date(b.fecha_confirmacion||0)-new Date(a.fecha_confirmacion||0)).forEach(r=>{if(!m.has(String(r.invitacion_id)))m.set(String(r.invitacion_id),r)});return m}
function responseFor(id){return latestMap().get(String(id))||null}
function statusFor(inv){if(!inv.activo)return{label:"Inactiva",cls:"inactive"};const r=responseFor(inv.id);if(!r)return{label:"Pendiente",cls:"pending"};if(r.estado==="confirmado")return{label:"Confirmado",cls:"confirmed"};if(r.estado==="no_asistira")return{label:"No asistirá",cls:"declined"};return{label:r.estado||"Pendiente",cls:"pending"}}
function renderStats(){const latest=latestMap();let assigned=0,confirmedPasses=0,confirmed=0,declined=0,pending=0;invitaciones.forEach(inv=>{assigned+=Number(inv.pases_asignados||0);const r=latest.get(String(inv.id));if(!r)pending++;else if(r.estado==="confirmado"){confirmed++;confirmedPasses+=Number(r.pases_confirmados||0)}else if(r.estado==="no_asistira")declined++;else pending++});$("statFamilies").textContent=invitaciones.length;$("statAssigned").textContent=assigned;$("statConfirmedPasses").textContent=confirmedPasses;$("statConfirmed").textContent=confirmed;$("statDeclined").textContent=declined;$("statPending").textContent=pending}
function renderFamilies(){const q=$("searchInput").value.trim().toLowerCase();const rows=invitaciones.filter(inv=>!q||String(inv.familia||"").toLowerCase().includes(q)).sort((a,b)=>String(a.familia).localeCompare(String(b.familia),"es"));$("familiesBody").innerHTML="";$("emptyState").classList.toggle("hidden",rows.length!==0);rows.forEach(inv=>{const r=responseFor(inv.id),s=statusFor(inv),count=r?.estado==="confirmado"?Number(r.pases_confirmados||0):0,tr=document.createElement("tr");tr.innerHTML=`<td class="family">${esc(inv.familia)}</td><td>${Number(inv.pases_asignados||0)}</td><td>${count}</td><td><span class="badge ${s.cls}">${esc(s.label)}</span></td><td><button class="icon-btn copy-btn" data-token="${esc(inv.token)}">COPIAR LINK</button><button class="icon-btn message-btn" data-id="${esc(inv.id)}">COPIAR MENSAJE</button></td><td><div class="actions"><button class="icon-btn edit-btn" data-id="${esc(inv.id)}">EDITAR</button><button class="icon-btn toggle-btn" data-id="${esc(inv.id)}">${inv.activo?"DESACTIVAR":"ACTIVAR"}</button><button class="icon-btn delete-btn" data-id="${esc(inv.id)}">ELIMINAR</button></div></td>`;$("familiesBody").appendChild(tr)});document.querySelectorAll(".copy-btn").forEach(btn=>btn.addEventListener("click",async()=>{const url=inviteUrl(btn.dataset.token);try{await navigator.clipboard.writeText(url);const old=btn.textContent;btn.textContent="COPIADO ✓";setTimeout(()=>btn.textContent=old,1500)}catch{window.prompt("Copia este enlace:",url)}}));document.querySelectorAll(".message-btn").forEach(btn=>btn.addEventListener("click",async()=>{
  const inv=invitaciones.find(x=>String(x.id)===String(btn.dataset.id));
  if(!inv)return;
  const url=inviteUrl(inv.token);
  const pases=Number(inv.pases_asignados||0);
  const mensaje=`🦖 ¡${inv.familia}, están invitados a nuestra Expedición Jurásica!

Hemos preparado una invitación especial para ustedes.

Su invitación incluye ${pases} ${pases===1?"pase":"pases"}.

Confirmen su asistencia desde su invitación personalizada:
${url}

¡Los esperamos! 🌿🦕`;
  try{
    await navigator.clipboard.writeText(mensaje);
    const textoOriginal=btn.textContent;
    btn.textContent="MENSAJE COPIADO ✓";
    setTimeout(()=>btn.textContent=textoOriginal,1600);
  }catch{
    window.prompt("Copia este mensaje:",mensaje);
  }
}));
document.querySelectorAll(".edit-btn").forEach(btn=>btn.addEventListener("click",()=>openEdit(btn.dataset.id)));document.querySelectorAll(".toggle-btn").forEach(btn=>btn.addEventListener("click",()=>toggleInvitation(btn.dataset.id)));document.querySelectorAll(".delete-btn").forEach(btn=>btn.addEventListener("click",()=>deleteInvitation(btn.dataset.id)))}
async function loadData(){const[{data:invData,error:invError},{data:confData,error:confError}]=await Promise.all([supabaseClient.from("invitaciones").select("id,familia,pases_asignados,token,activo,fecha_creacion").order("fecha_creacion",{ascending:false}),supabaseClient.from("confirmaciones").select("id,invitacion_id,pases_confirmados,estado,observaciones,fecha_confirmacion").order("fecha_confirmacion",{ascending:false})]);if(invError)throw invError;if(confError)throw confError;invitaciones=invData||[];confirmaciones=confData||[];renderStats();renderFamilies()}
async function showAdmin(session){$("loginView").classList.add("hidden");$("adminView").classList.remove("hidden");$("sessionEmail").textContent=session?.user?.email||"Sesión administrativa";try{await loadData()}catch(e){console.error(e);alert("No fue posible cargar el panel. Revisa los permisos administrativos en Supabase.")}}
function showLogin(){$("adminView").classList.add("hidden");$("loginView").classList.remove("hidden")}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginButton").disabled=true;$("loginMessage").textContent="Verificando acceso...";const email=$("email").value.trim(),password=$("password").value;const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});$("loginButton").disabled=false;if(error){console.error(error);$("loginMessage").textContent="Correo o contraseña incorrectos.";return}$("loginMessage").textContent="";await showAdmin(data.session)});
$("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();showLogin()});$("refreshButton").addEventListener("click",async()=>{try{await loadData()}catch(e){console.error(e);alert("No fue posible actualizar los datos.")}});$("searchInput").addEventListener("input",renderFamilies);
function openNew(){$("editId").value="";$("modalTitle").textContent="Agregar familia";$("familyInput").value="";$("passesInput").value="2";$("activeInput").checked=true;$("familyMessage").textContent="";$("familyModal").classList.add("open");$("familyModal").setAttribute("aria-hidden","false");setTimeout(()=>$("familyInput").focus(),50)}
function openEdit(id){const inv=invitaciones.find(x=>String(x.id)===String(id));if(!inv)return;$("editId").value=inv.id;$("modalTitle").textContent="Editar familia";$("familyInput").value=inv.familia;$("passesInput").value=inv.pases_asignados;$("activeInput").checked=Boolean(inv.activo);$("familyMessage").textContent="";$("familyModal").classList.add("open");$("familyModal").setAttribute("aria-hidden","false")}
function closeModal(){$("familyModal").classList.remove("open");$("familyModal").setAttribute("aria-hidden","true")}
$("newFamilyButton").addEventListener("click",openNew);$("cancelModalButton").addEventListener("click",closeModal);$("familyModal").addEventListener("click",e=>{if(e.target===$("familyModal"))closeModal()});
$("familyForm").addEventListener("submit",async e=>{e.preventDefault();const familia=$("familyInput").value.trim(),pases=Number($("passesInput").value),activo=$("activeInput").checked;if(!familia){$("familyMessage").textContent="Escribe el nombre de la familia.";return}if(!Number.isInteger(pases)||pases<1||pases>50){$("familyMessage").textContent="La cantidad de pases debe estar entre 1 y 50.";return}$("saveFamilyButton").disabled=true;$("familyMessage").textContent="Guardando...";let error=null;if($("editId").value){({error}=await supabaseClient.from("invitaciones").update({familia,pases_asignados:pases,activo}).eq("id",$("editId").value))}else{({error}=await supabaseClient.from("invitaciones").insert({familia,pases_asignados:pases,token:crypto.randomUUID(),activo}))}$("saveFamilyButton").disabled=false;if(error){console.error(error);$("familyMessage").textContent="No se pudo guardar. Revisa los permisos o los datos.";return}closeModal();await loadData()});
async function toggleInvitation(id){const inv=invitaciones.find(x=>String(x.id)===String(id));if(!inv)return;const newValue=!inv.activo;if(!confirm(`${newValue?"Activar":"Desactivar"} la invitación de ${inv.familia}?`))return;const{error}=await supabaseClient.from("invitaciones").update({activo:newValue}).eq("id",inv.id);if(error){console.error(error);alert("No se pudo cambiar el estado de la invitación.");return}await loadData()}
async function deleteInvitation(id){
  const inv=invitaciones.find(x=>String(x.id)===String(id));
  if(!inv)return;

  const ok=confirm(`¿Eliminar definitivamente a ${inv.familia}?\n\nTambién se eliminará su respuesta de asistencia si ya existe.\nEsta acción no se puede deshacer.`);
  if(!ok)return;

  const{error:confError}=await supabaseClient.from("confirmaciones").delete().eq("invitacion_id",inv.id);
  if(confError){
    console.error(confError);
    alert("No se pudo eliminar la confirmación asociada.");
    return;
  }

  const{error:invError}=await supabaseClient.from("invitaciones").delete().eq("id",inv.id);
  if(invError){
    console.error(invError);
    alert("No se pudo eliminar la familia.");
    return;
  }

  await loadData();
}
async function init(){const{data:{session}}=await supabaseClient.auth.getSession();if(session)await showAdmin(session);else showLogin()}init();
</script>
</body>
</html>
